[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "camera-tracking-extension"
version = "0.1.0"
description = "Lightweight monocular 3D camera tracking engine"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.24", "opencv-python>=4.8"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
camera-track = "camera_tracker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
